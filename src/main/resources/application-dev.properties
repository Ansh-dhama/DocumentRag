# ==========================================
# SERVER
# ==========================================
server.port=8081


# ==========================================
# DATABASE - POSTGRESQL
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5434/docRag
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# ==========================================
# GEMINI CHAT MODEL
# ==========================================
spring.ai.google.genai.chat.model=gemini-3.6-flash
spring.ai.google.genai.api-key=${GEMINI_CHAT_API_KEY}


# ==========================================
# GOOGLE GENAI EMBEDDING MODEL
# ==========================================
spring.ai.model.embedding=none
spring.ai.model.embedding.text=google-genai

spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.api-key=${GEMINI_EMBEDDING_API_KEY}
spring.ai.google.genai.embedding.text.dimensions=1536


# ==========================================
# GROQ CHAT MODEL
# ==========================================
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.model=openai/gpt-oss-20b
spring.ai.openai.chat.replay-reasoning-content=false


# ==========================================
# PGVECTOR
# ==========================================
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.schema-name=public


# ==========================================
# FILE UPLOAD
# ==========================================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB


# ==========================================
# RAG CONFIGURATION
# ==========================================
spring.app.rag.chunk-size=700
spring.app.rag.chunk-overlap=100
spring.app.rag.top-k=5
spring.app.rag.similarity-threshold=0


# ==========================================
# CORS
# ==========================================
spring.app.cors.allowed-origins=*
spring.app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.app.cors.allowed-headers=*